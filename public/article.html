<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Article | Vermor Club</title>
    <meta name="description" content="" />
    <link rel="canonical" href="" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta property="og:image" content="" />
    <meta property="og:url" content="" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">Vermor Club</div>
      <nav class="site-nav" aria-label="Navigation principale">
        <a class="nav-link" href="/">Accueil</a>
        <a class="nav-link" href="/articles">Articles</a>
        <div class="nav-dropdown" id="categoriesDropdown">
          <button
            id="categoriesToggle"
            class="dropdown-toggle"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Categories
          </button>
          <div id="categoriesMenu" class="dropdown-menu" hidden>
            <a class="dropdown-item" href="/articles">Toutes categories</a>
          </div>
        </div>
      </nav>
      <a class="admin-link" href="/admin/login">Admin</a>
    </header>

    <main>
      <article class="admin-panel admin-panel-wide article-view">
        <h1 id="title">Chargement...</h1>
        <p id="meta" class="article-meta" hidden></p>
        <p id="excerpt" class="article-excerpt"></p>
        <img id="cover" class="cover-image" alt="" hidden />
        <div id="content" class="article-content"></div>
        <section id="opinionBlock" class="opinion-block" hidden>
          <h2 id="opinionQuestion">Votre opinion</h2>
          <p id="opinionStatus" class="muted"></p>
          <div id="opinionOptions" class="opinion-options"></div>
          <div class="opinion-actions">
            <button id="openCustomOptionBtn" class="btn btn-ghost" type="button">Proposer mon propre choix</button>
            <button id="openExplanationBtn" class="btn btn-ghost" type="button" hidden>Ajouter une explication</button>
          </div>
          <form id="opinionExplanationForm" class="opinion-custom-form" hidden>
            <h3>Ajouter une explication (optionnel)</h3>
            <label class="field">
              <span>Ton explication (max 500)</span>
              <textarea id="voteExplanationInput" rows="3" maxlength="500" placeholder="Pourquoi ce choix ?"></textarea>
            </label>
            <div class="opinion-actions">
              <button class="btn btn-primary" type="submit">Enregistrer mon explication</button>
              <button id="skipExplanationBtn" class="btn btn-ghost" type="button">Passer</button>
            </div>
          </form>
          <form id="opinionCustomForm" class="opinion-custom-form" hidden>
            <h3>Autre proposition</h3>
            <label class="field">
              <span>Choix (max 60)</span>
              <input id="customOptionLabel" type="text" maxlength="60" required />
            </label>
            <label class="field">
              <span>Explication (max 500)</span>
              <textarea id="customOptionDescription" rows="3" maxlength="500" required></textarea>
            </label>
            <button class="btn btn-primary" type="submit">Proposer et voter</button>
          </form>
          <section class="opinion-explanations-wrap">
            <h3>Explications des lecteurs</h3>
            <div id="opinionExplanations" class="opinion-explanations"></div>
          </section>
        </section>
      </article>
    </main>

    <script>
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const slug = pathParts[pathParts.length - 1] || '';

      const titleEl = document.getElementById('title');
      const metaEl = document.getElementById('meta');
      const excerptEl = document.getElementById('excerpt');
      const contentEl = document.getElementById('content');
      const coverEl = document.getElementById('cover');
      const opinionBlockEl = document.getElementById('opinionBlock');
      const opinionQuestionEl = document.getElementById('opinionQuestion');
      const opinionStatusEl = document.getElementById('opinionStatus');
      const opinionOptionsEl = document.getElementById('opinionOptions');
      const opinionExplanationsEl = document.getElementById('opinionExplanations');
      const opinionExplanationFormEl = document.getElementById('opinionExplanationForm');
      const voteExplanationInputEl = document.getElementById('voteExplanationInput');
      const skipExplanationBtnEl = document.getElementById('skipExplanationBtn');
      const openCustomOptionBtnEl = document.getElementById('openCustomOptionBtn');
      const openExplanationBtnEl = document.getElementById('openExplanationBtn');
      const opinionCustomFormEl = document.getElementById('opinionCustomForm');
      const customOptionLabelEl = document.getElementById('customOptionLabel');
      const customOptionDescriptionEl = document.getElementById('customOptionDescription');
      const categoriesToggleEl = document.getElementById('categoriesToggle');
      const categoriesMenuEl = document.getElementById('categoriesMenu');
      const categoriesDropdownEl = document.getElementById('categoriesDropdown');
      const escapeHtml = (value) => String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
      const closeCategoriesMenu = () => {
        if (!categoriesMenuEl || !categoriesToggleEl) return;
        categoriesMenuEl.hidden = true;
        categoriesToggleEl.setAttribute('aria-expanded', 'false');
      };

      const openCategoriesMenu = () => {
        if (!categoriesMenuEl || !categoriesToggleEl) return;
        categoriesMenuEl.hidden = false;
        categoriesToggleEl.setAttribute('aria-expanded', 'true');
      };

      const renderCategoryMenu = (categories) => {
        if (!categoriesMenuEl) return;
        const list = Array.isArray(categories) ? categories.filter(Boolean) : [];
        categoriesMenuEl.innerHTML = `
          <a class="dropdown-item" href="/articles">Toutes categories</a>
          ${list.map((category) => `
            <a class="dropdown-item" href="/articles?category=${encodeURIComponent(category)}">${escapeHtml(category)}</a>
          `).join('')}
        `;
      };

      const renderMetaLine = (article) => {
        const categories = Array.isArray(article.categories) ? article.categories.filter(Boolean) : [];
        const tags = Array.isArray(article.tags) ? article.tags.filter(Boolean) : [];
        const groups = [];

        if (categories.length) {
          groups.push(`
            <span class="meta-group">
              <strong>Categories:</strong>
              ${categories.map((x) => `<span class="chip">${escapeHtml(x)}</span>`).join('')}
            </span>
          `);
        }
        if (tags.length) {
          groups.push(`
            <span class="meta-group">
              <strong>Tags:</strong>
              ${tags.map((x) => `<span class="chip">${escapeHtml(x)}</span>`).join('')}
            </span>
          `);
        }

        if (!groups.length) {
          metaEl.hidden = true;
          metaEl.innerHTML = '';
          return;
        }

        metaEl.hidden = false;
        metaEl.innerHTML = groups.join('');
      };

      const setMeta = (selector, value) => {
        const el = document.querySelector(selector);
        if (el) {
          el.setAttribute('content', value || '');
        }
      };

      const setOpinionNotice = (message, isError = false) => {
        if (!opinionStatusEl) return;
        opinionStatusEl.textContent = message || '';
        opinionStatusEl.className = isError ? 'error' : 'muted';
      };

      let currentVotedOptionId = 0;
      let customFormOpen = false;
      let explanationFormOpen = false;

      const renderOpinion = (snapshot) => {
        if (!opinionBlockEl || !opinionOptionsEl || !snapshot || !snapshot.enabled) {
          if (opinionBlockEl) opinionBlockEl.hidden = true;
          return;
        }

        opinionBlockEl.hidden = false;
        opinionQuestionEl.textContent = snapshot.question || 'Votre opinion';
        const totalVotes = Number(snapshot.totalVotes || 0);
        setOpinionNotice(totalVotes ? `${totalVotes} vote(s)` : 'Soyez le premier a voter.');

        const selected = Number(snapshot.userVoteOptionId || 0) || 0;
        const userCustomOptionId = Number(snapshot.userCustomOptionId || 0) || 0;
        currentVotedOptionId = selected || currentVotedOptionId;
        const selectedOption = (Array.isArray(snapshot.options) ? snapshot.options : []).find((x) => Number(x.id) === selected) || null;
        const canExplain = Boolean(selected && selectedOption && !selectedOption.isMine);

        if (openCustomOptionBtnEl) {
          openCustomOptionBtnEl.hidden = Boolean(userCustomOptionId);
        }
        if (opinionCustomFormEl) {
          if (userCustomOptionId) {
            customFormOpen = false;
            opinionCustomFormEl.hidden = true;
          } else {
            opinionCustomFormEl.hidden = !customFormOpen;
          }
        }

        if (openExplanationBtnEl) {
          openExplanationBtnEl.hidden = !canExplain;
          openExplanationBtnEl.textContent = String(snapshot.userExplanation || '').trim()
            ? 'Modifier mon explication'
            : 'Ajouter une explication';
        }
        if (opinionExplanationFormEl) {
          if (!canExplain) {
            explanationFormOpen = false;
            opinionExplanationFormEl.hidden = true;
          } else {
            opinionExplanationFormEl.hidden = !explanationFormOpen;
          }
        }
        if (voteExplanationInputEl && canExplain) {
          voteExplanationInputEl.value = String(snapshot.userExplanation || '');
        }
        const options = Array.isArray(snapshot.options) ? snapshot.options : [];
        opinionOptionsEl.innerHTML = options.length ? options.map((opt) => {
          const voteCount = Number(opt.votes || 0);
          const pct = totalVotes > 0 ? Math.round((voteCount / totalVotes) * 100) : 0;
          const isSelected = selected === Number(opt.id);
          return `
            <article class="opinion-option ${isSelected ? 'opinion-selected' : ''}">
              <div class="opinion-option-head">
                <strong>${escapeHtml(opt.label)}</strong>
                <span class="muted">${voteCount} vote(s) - ${pct}%</span>
              </div>
              ${opt.description ? `<p class="muted">${escapeHtml(opt.description)}</p>` : ''}
              <div class="opinion-bar"><span style="width:${pct}%;"></span></div>
              <div class="opinion-actions">
                <button class="btn btn-ghost" type="button" data-opinion-vote="${opt.id}">${isSelected ? 'Vote actuel' : 'Voter'}</button>
              </div>
            </article>
          `;
        }).join('') : '<p class="muted">Aucun choix disponible.</p>';

        if (opinionExplanationsEl) {
          const explanations = Array.isArray(snapshot.explanations) ? snapshot.explanations : [];
          opinionExplanationsEl.innerHTML = explanations.length
            ? explanations.map((x) => `
              <article class="opinion-explanation">
                <strong>${escapeHtml(x.optionLabel || '')}</strong>
                <p>${escapeHtml(x.explanation || '')}</p>
              </article>
            `).join('')
            : '<p class="muted">Aucune explication pour le moment.</p>';
        }
      };

      const loadOpinion = async () => {
        if (!slug) return;
        try {
          const response = await fetch(`/api/articles/${encodeURIComponent(slug)}/opinion`, { cache: 'no-store' });
          if (!response.ok) return;
          const snapshot = await response.json();
          renderOpinion(snapshot);
        } catch (_error) {
          if (opinionBlockEl) opinionBlockEl.hidden = true;
        }
      };

      const normalizeTitleText = (value) => String(value || '')
        .toLowerCase()
        .replace(/[“”"']/g, '')
        .replace(/[\s\-_:.!?;,()]+/g, ' ')
        .trim();

      const removeDuplicateLeadTitle = (html, articleTitle) => {
        const wrap = document.createElement('div');
        wrap.innerHTML = html || '';
        const first = wrap.firstElementChild;
        if (!first) return html || '';

        const titleNorm = normalizeTitleText(articleTitle);
        const firstNorm = normalizeTitleText(first.textContent || '');
        if (!titleNorm || !firstNorm) return html || '';

        if (firstNorm === titleNorm) {
          first.remove();
          return wrap.innerHTML;
        }
        return html || '';
      };

      fetch('/api/articles?page=1&pageSize=1', { cache: 'no-store' })
        .then((res) => (res.ok ? res.json() : null))
        .then((payload) => {
          const categories = payload && payload.taxonomies ? payload.taxonomies.categories || [] : [];
          renderCategoryMenu(categories);
        })
        .catch(() => {
          renderCategoryMenu([]);
        });

      fetch(`/api/articles/${encodeURIComponent(slug)}`, { cache: 'no-store' })
        .then((res) => {
          if (!res.ok) throw new Error('Article introuvable');
          return res.json();
        })
        .then((article) => {
          titleEl.textContent = article.title;
          renderMetaLine(article);
          excerptEl.textContent = article.excerpt || '';
          document.title = article.seoTitle || article.title || 'Article | Vermor Club';
          setMeta('meta[name=\"description\"]', article.seoDescription || article.excerpt || '');

          let contentHtml = article.content || '<p>Contenu vide.</p>';
          if (article.coverImageUrl) {
            coverEl.src = article.coverImageUrl;
            coverEl.alt = article.title;
            coverEl.hidden = false;
          } else {
            contentHtml = removeDuplicateLeadTitle(contentHtml, article.title || '');
          }

          contentEl.innerHTML = contentHtml;
          loadOpinion().catch(() => {});
        })
        .catch(() => {
          titleEl.textContent = 'Article introuvable';
          metaEl.hidden = true;
          metaEl.innerHTML = '';
          excerptEl.textContent = '';
          contentEl.innerHTML = '<p>Ce contenu nest pas disponible.</p>';
        });

      if (opinionOptionsEl) {
        opinionOptionsEl.addEventListener('click', async (event) => {
          const voteId = Number(event.target.getAttribute('data-opinion-vote') || 0);
          if (!voteId) return;

          try {
            const response = await fetch(`/api/articles/${encodeURIComponent(slug)}/opinion/vote`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ optionId: voteId })
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || 'Vote impossible');
            renderOpinion(payload.snapshot);
            const selectedOption = Array.isArray(payload.snapshot && payload.snapshot.options)
              ? payload.snapshot.options.find((x) => Number(x.id) === Number(payload.snapshot.userVoteOptionId || 0))
              : null;
            const canExplain = Boolean(selectedOption && !selectedOption.isMine);
            setOpinionNotice(canExplain
              ? 'Vote enregistre. Tu peux ajouter une explication.'
              : 'Vote enregistre.');
          } catch (error) {
            setOpinionNotice(error.message || 'Erreur', true);
          }
        });
      }

      if (opinionCustomFormEl) {
        opinionCustomFormEl.addEventListener('submit', async (event) => {
          event.preventDefault();
          const customLabel = String(customOptionLabelEl.value || '').trim();
          const customDescription = String(customOptionDescriptionEl.value || '').trim();
          if (!customLabel || !customDescription) {
            setOpinionNotice('Choix et opinion sont obligatoires.', true);
            return;
          }
          try {
            const response = await fetch(`/api/articles/${encodeURIComponent(slug)}/opinion/vote`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ customLabel, customDescription })
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || 'Envoi impossible');
            renderOpinion(payload.snapshot);
            customOptionLabelEl.value = '';
            customOptionDescriptionEl.value = '';
            customFormOpen = false;
            if (opinionCustomFormEl) opinionCustomFormEl.hidden = true;
            setOpinionNotice('Choix ajoute et vote enregistre.');
          } catch (error) {
            setOpinionNotice(error.message || 'Erreur', true);
          }
        });
      }

      if (opinionExplanationFormEl) {
        opinionExplanationFormEl.addEventListener('submit', async (event) => {
          event.preventDefault();
          if (!currentVotedOptionId) {
            setOpinionNotice('Vote dabord pour ajouter une explication.', true);
            return;
          }
          try {
            const response = await fetch(`/api/articles/${encodeURIComponent(slug)}/opinion/vote`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                optionId: currentVotedOptionId,
                explanation: String(voteExplanationInputEl.value || '').trim()
              })
            });
            const payload = await response.json();
            if (!response.ok) throw new Error(payload.error || 'Impossible denregistrer lexplication');
            renderOpinion(payload.snapshot);
            setOpinionNotice('Explication enregistree.');
            explanationFormOpen = false;
            if (opinionExplanationFormEl) opinionExplanationFormEl.hidden = true;
          } catch (error) {
            setOpinionNotice(error.message || 'Erreur', true);
          }
        });
      }

      if (skipExplanationBtnEl) {
        skipExplanationBtnEl.addEventListener('click', () => {
          explanationFormOpen = false;
          if (opinionExplanationFormEl) opinionExplanationFormEl.hidden = true;
          setOpinionNotice('OK, vote enregistre sans explication.');
        });
      }

      if (openCustomOptionBtnEl) {
        openCustomOptionBtnEl.addEventListener('click', () => {
          customFormOpen = true;
          if (opinionCustomFormEl) opinionCustomFormEl.hidden = false;
        });
      }

      if (openExplanationBtnEl) {
        openExplanationBtnEl.addEventListener('click', () => {
          explanationFormOpen = true;
          if (opinionExplanationFormEl) opinionExplanationFormEl.hidden = false;
        });
      }

      if (categoriesToggleEl && categoriesDropdownEl) {
        categoriesToggleEl.addEventListener('click', (event) => {
          event.preventDefault();
          const expanded = categoriesToggleEl.getAttribute('aria-expanded') === 'true';
          if (expanded) {
            closeCategoriesMenu();
            return;
          }
          openCategoriesMenu();
        });

        document.addEventListener('click', (event) => {
          if (!categoriesDropdownEl.contains(event.target)) {
            closeCategoriesMenu();
          }
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeCategoriesMenu();
        });

        categoriesMenuEl.addEventListener('click', () => {
          closeCategoriesMenu();
        });
      }
    </script>
  </body>
</html>
