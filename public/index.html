<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="666abaf3-f19c-498a-a3c3-b023f0d3695e"></script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Vermor Club | Actualites et analyses</title>
    <meta name="description" content="Vermor Club: actualites, analyses et debats sur les sujets qui comptent." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="/" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vermor Club" />
    <meta property="og:title" content="Vermor Club | Actualites et analyses" />
    <meta property="og:description" content="Vermor Club: actualites, analyses et debats sur les sujets qui comptent." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/favicon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vermor Club | Actualites et analyses" />
    <meta name="twitter:description" content="Vermor Club: actualites, analyses et debats sur les sujets qui comptent." />
    <meta name="twitter:image" content="/favicon.png" />
    <script type="application/ld+json" id="homeJsonLd">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Vermor Club",
        "url": "/",
        "inLanguage": "fr"
      }
    </script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand" id="brand">Vermor Club</div>
      <nav class="site-nav" aria-label="Navigation principale">
        <a class="nav-link" href="/">Accueil</a>
        <a class="nav-link" href="/articles">Articles</a>
        <a class="nav-link" href="/sondage">Sondage</a>
        <div class="nav-dropdown" id="categoriesDropdown">
          <button
            id="categoriesToggle"
            class="dropdown-toggle"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Categories
          </button>
          <div id="categoriesMenu" class="dropdown-menu" hidden>
            <a class="dropdown-item" href="/articles">Toutes categories</a>
          </div>
        </div>
      </nav>
      <a class="admin-link" href="/admin/login">Admin</a>
    </header>

    <main>
      <section class="hero featured-hero" id="featuredHero">
        <p class="muted">Chargement de l'article en vedette...</p>
      </section>

      <section id="rubricsSection" class="admin-panel article-list-panel latest-article-section" hidden>
        <h2>Rubriques</h2>
        <div id="rubricsBlocks"></div>
      </section>

      <section class="admin-panel article-list-panel latest-article-section">
        <h2>Derniers articles publies</h2>
        <div id="latestArticle">
          <p class="muted">Chargement...</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> <span id="footerText">Vermor Club</span></p>
    </footer>

    <script>
      const setText = (id, value) => {
        const el = document.getElementById(id);
        if (el && typeof value === 'string') {
          el.textContent = value;
        }
      };

      const setMetaContent = (selector, value) => {
        const el = document.querySelector(selector);
        if (el && typeof value === 'string' && value.trim()) {
          el.setAttribute('content', value.trim());
        }
      };

      const setCanonical = () => {
        const canonical = document.querySelector('link[rel="canonical"]');
        if (!canonical) return;
        canonical.setAttribute('href', `${window.location.origin}/`);
      };

      const setJsonLd = (titleText, descriptionText, siteNameText) => {
        const scriptEl = document.getElementById('homeJsonLd');
        if (!scriptEl) return;
        scriptEl.textContent = JSON.stringify({
          '@context': 'https://schema.org',
          '@type': 'WebSite',
          name: siteNameText || 'Vermor Club',
          url: `${window.location.origin}/`,
          inLanguage: 'fr',
          description: descriptionText || 'Vermor Club',
          potentialAction: {
            '@type': 'SearchAction',
            target: `${window.location.origin}/articles?q={search_term_string}`,
            'query-input': 'required name=search_term_string'
          }
        });
      };

      const categoriesToggleEl = document.getElementById('categoriesToggle');
      const categoriesMenuEl = document.getElementById('categoriesMenu');
      const categoriesDropdownEl = document.getElementById('categoriesDropdown');
      const rubricsSectionEl = document.getElementById('rubricsSection');
      const rubricsBlocksEl = document.getElementById('rubricsBlocks');
      let landingRubrics = [];
      const usedHomepageArticleKeys = new Set();

      const closeCategoriesMenu = () => {
        if (!categoriesMenuEl || !categoriesToggleEl) return;
        categoriesMenuEl.hidden = true;
        categoriesToggleEl.setAttribute('aria-expanded', 'false');
      };

      const openCategoriesMenu = () => {
        if (!categoriesMenuEl || !categoriesToggleEl) return;
        categoriesMenuEl.hidden = false;
        categoriesToggleEl.setAttribute('aria-expanded', 'true');
      };

      const renderCategoryMenu = (categories) => {
        if (!categoriesMenuEl) return;
        const list = Array.isArray(categories) ? categories.filter(Boolean) : [];
        categoriesMenuEl.innerHTML = `
          <a class="dropdown-item" href="/articles">Toutes categories</a>
          ${list.map((category) => `
            <a class="dropdown-item" href="/articles?category=${encodeURIComponent(category)}">${escapeHtml(category)}</a>
          `).join('')}
        `;
      };

      const applyLandingContent = (content) => {
        if (!content || typeof content !== 'object') return;

        const pageTitle = String(content.pageTitle || '').trim();
        const metaDescription = String(content.metaDescription || '').trim();
        const siteName = String(content.siteName || 'Vermor Club').trim() || 'Vermor Club';

        if (content.pageTitle) {
          document.title = pageTitle;
          setMetaContent('meta[property="og:title"]', pageTitle);
          setMetaContent('meta[name="twitter:title"]', pageTitle);
        }

        if (metaDescription) {
          setMetaContent('meta[name="description"]', metaDescription);
          setMetaContent('meta[property="og:description"]', metaDescription);
          setMetaContent('meta[name="twitter:description"]', metaDescription);
        }

        setText('brand', content.siteName);
        setText('footerText', content.footerText || content.siteName);
        setMetaContent('meta[property="og:site_name"]', siteName);
        setMetaContent('meta[property="og:url"]', `${window.location.origin}/`);
        setMetaContent('meta[property="og:image"]', `${window.location.origin}/favicon.png`);
        setMetaContent('meta[name="twitter:image"]', `${window.location.origin}/favicon.png`);
        setCanonical();
        setJsonLd(pageTitle || document.title, metaDescription || '', siteName);
        landingRubrics = Array.isArray(content.rubrics) ? content.rubrics : [];
      };

      const loadLandingContent = async () => {
        try {
          const response = await fetch('/api/landing', { cache: 'no-store' });
          if (!response.ok) return;
          const content = await response.json();
          applyLandingContent(content);
        } catch (error) {
          console.error('Landing content load failed:', error);
        }
      };

      const escapeHtml = (value) => String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

      const categoryStyle = (value) => {
        const text = String(value || '');
        let hash = 0;
        for (let i = 0; i < text.length; i += 1) {
          hash = ((hash << 5) - hash) + text.charCodeAt(i);
          hash |= 0;
        }
        const hue = Math.abs(hash) % 360;
        return `--chip-bg:hsl(${hue} 85% 94%);--chip-border:hsl(${hue} 50% 78%);--chip-ink:hsl(${hue} 45% 28%);`;
      };

      const getArticleKey = (article) => {
        if (!article || typeof article !== 'object') return '';
        if (article.id !== undefined && article.id !== null) return `id:${article.id}`;
        if (article.slug) return `slug:${article.slug}`;
        return '';
      };

      const markArticleAsUsed = (article) => {
        const key = getArticleKey(article);
        if (!key || usedHomepageArticleKeys.has(key)) return false;
        usedHomepageArticleKeys.add(key);
        return true;
      };

      const renderCategoryLine = (article) => {
        const categories = Array.isArray(article.categories) ? article.categories.filter(Boolean) : [];
        if (!categories.length) return '';
        return `
          <p class="article-meta">
            <span class="meta-group">
              ${categories.map((x) => `<a class="chip chip-category chip-link" style="${categoryStyle(x)}" href="/articles?category=${encodeURIComponent(x)}">${escapeHtml(x)}</a>`).join('')}
            </span>
          </p>
        `;
      };

      const renderLatestArticles = (articles) => {
        const container = document.getElementById('latestArticle');
        if (!container) return;

        if (!Array.isArray(articles) || !articles.length) {
          container.innerHTML = '<p class="muted">Aucun article publie pour le moment.</p>';
          return;
        }

        container.innerHTML = `
          <div class="article-card-grid">
            ${articles.map((article) => `
              <article class="article-card">
                ${article.coverImageUrl ? `<a href="/article/${encodeURIComponent(article.slug)}"><img class="article-card-cover" src="${article.coverImageUrl}" alt="${escapeHtml(article.title)}" loading="lazy" /></a>` : ''}
                <div class="article-card-body">
                  ${renderCategoryLine(article)}
                  <h3><a href="/article/${encodeURIComponent(article.slug)}">${escapeHtml(article.title)}</a></h3>
                  ${article.excerpt ? `<p class="article-excerpt">${escapeHtml(article.excerpt)}</p>` : ''}
                </div>
              </article>
            `).join('')}
          </div>
        `;
      };

      const renderFeaturedHero = (article) => {
        const heroEl = document.getElementById('featuredHero');
        if (!heroEl) return;

        if (!article) {
          heroEl.innerHTML = `
            <div class="featured-hero-fallback">
              <h1>Vermor Club</h1>
              <p class="subtitle">Aucun article en vedette pour le moment.</p>
            </div>
          `;
          return;
        }

        const title = escapeHtml(article.title || 'Article en vedette');
        const excerpt = article.excerpt ? `<p class="featured-hero-excerpt">${escapeHtml(article.excerpt)}</p>` : '';
        const href = `/article/${encodeURIComponent(article.slug)}`;

        if (!article.coverImageUrl) {
          heroEl.innerHTML = `
            <div class="featured-hero-link featured-hero-link-no-image">
              <div class="featured-hero-overlay">
                ${renderCategoryLine(article)}
                <h1><a class="featured-hero-title-link" href="${href}">${title}</a></h1>
                ${excerpt}
              </div>
            </div>
          `;
          return;
        }

        heroEl.innerHTML = `
          <div class="featured-hero-link">
            <a class="featured-hero-image-link" href="${href}">
              <img class="featured-hero-image" src="${article.coverImageUrl}" alt="${title}" loading="eager" />
            </a>
            <div class="featured-hero-overlay">
              ${renderCategoryLine(article)}
              <h1><a class="featured-hero-title-link" href="${href}">${title}</a></h1>
              ${excerpt}
            </div>
          </div>
        `;
      };

      const loadFeaturedArticle = async () => {
        try {
          const featuredResponse = await fetch('/api/articles?page=1&pageSize=1&featured=true', { cache: 'no-store' });
          if (!featuredResponse.ok) throw new Error('Failed to load featured article');
          const featuredPayload = await featuredResponse.json();
          const featured = Array.isArray(featuredPayload.items) ? featuredPayload.items[0] : null;
          if (featured) {
            renderFeaturedHero(featured);
            markArticleAsUsed(featured);
            return;
          }

          const fallbackResponse = await fetch('/api/articles?page=1&pageSize=1', { cache: 'no-store' });
          if (!fallbackResponse.ok) throw new Error('Failed to load fallback article');
          const fallbackPayload = await fallbackResponse.json();
          const fallback = Array.isArray(fallbackPayload.items) ? fallbackPayload.items[0] : null;
          renderFeaturedHero(fallback || null);
          if (fallback) {
            markArticleAsUsed(fallback);
          }
        } catch (error) {
          renderFeaturedHero(null);
          console.error(error);
        }
      };

      const fetchUniqueRubricArticles = async (categories, limit) => {
        const uniqueArticles = [];
        let page = 1;
        const pageSize = Math.min(24, Math.max(limit * 3, limit));

        while (uniqueArticles.length < limit && page <= 5) {
          const params = new URLSearchParams({
            page: String(page),
            pageSize: String(pageSize),
            categories: categories.join(',')
          });
          const response = await fetch(`/api/articles?${params.toString()}`, { cache: 'no-store' });
          if (!response.ok) break;
          const payload = await response.json();
          const items = Array.isArray(payload.items) ? payload.items : [];
          if (!items.length) break;

          for (const article of items) {
            if (!markArticleAsUsed(article)) continue;
            uniqueArticles.push(article);
            if (uniqueArticles.length >= limit) break;
          }

          if (items.length < pageSize) break;
          page += 1;
        }

        return uniqueArticles;
      };

      const renderRubricBlock = (title, articles) => {
        const safeArticles = Array.isArray(articles) ? articles : [];
        const cols = Math.max(1, Math.min(3, safeArticles.length || 1));
        const sizeClass = safeArticles.length > 1 ? 'rubric-block-multi' : 'rubric-block-single';
        return `
          <section class="rubric-block ${sizeClass}">
            <h3>${escapeHtml(title)}</h3>
            <div class="article-card-grid rubric-card-grid" style="--rubric-cols:${cols};">
              ${safeArticles.length ? safeArticles.map((article) => `
                <article class="article-card">
                  ${article.coverImageUrl ? `<a href="/article/${encodeURIComponent(article.slug)}"><img class="article-card-cover" src="${article.coverImageUrl}" alt="${escapeHtml(article.title)}" loading="lazy" /></a>` : ''}
                  <div class="article-card-body">
                    ${renderCategoryLine(article)}
                    <h3><a href="/article/${encodeURIComponent(article.slug)}">${escapeHtml(article.title)}</a></h3>
                    ${article.excerpt ? `<p class="article-excerpt">${escapeHtml(article.excerpt)}</p>` : ''}
                  </div>
                </article>
              `).join('') : '<p class="muted">Aucun article dans cette rubrique pour le moment.</p>'}
            </div>
          </section>
        `;
      };

      const loadRubrics = async () => {
        if (!rubricsSectionEl || !rubricsBlocksEl) return;
        const safeRubrics = Array.isArray(landingRubrics) ? landingRubrics : [];
        if (!safeRubrics.length) {
          rubricsSectionEl.hidden = true;
          rubricsBlocksEl.innerHTML = '';
          return;
        }

        rubricsSectionEl.hidden = false;
        rubricsBlocksEl.innerHTML = '<p class="muted">Chargement des rubriques...</p>';

        const blocks = [];
        for (const rubric of safeRubrics) {
          const categories = Array.isArray(rubric.categories) ? rubric.categories.filter(Boolean) : [];
          const limit = Math.max(1, Math.min(12, Number(rubric.limit) || 3));
          const title = String(rubric.title || '').trim();
          if (!title || !categories.length) continue;

          const articles = await fetchUniqueRubricArticles(categories, limit);
          blocks.push(renderRubricBlock(title, articles));
        }

        const html = blocks.filter(Boolean).join('');
        rubricsSectionEl.hidden = false;
        rubricsBlocksEl.innerHTML = `<div class="rubrics-layout">${html}</div>`;
      };

      const loadLatestArticle = async () => {
        try {
          const pageSize = 12;
          const limit = 3;
          const uniqueArticles = [];
          let page = 1;
          let categories = [];

          while (uniqueArticles.length < limit && page <= 5) {
            const response = await fetch(`/api/articles?page=${page}&pageSize=${pageSize}`, { cache: 'no-store' });
            if (!response.ok) throw new Error('Failed to load articles');
            const payload = await response.json();
            const items = Array.isArray(payload.items) ? payload.items : [];
            if (!categories.length) {
              categories = (payload.taxonomies || {}).categories || [];
            }
            if (!items.length) break;

            for (const article of items) {
              if (!markArticleAsUsed(article)) continue;
              uniqueArticles.push(article);
              if (uniqueArticles.length >= limit) break;
            }

            if (items.length < pageSize) break;
            page += 1;
          }

          renderLatestArticles(uniqueArticles);
          renderCategoryMenu(categories);
        } catch (error) {
          const container = document.getElementById('latestArticle');
          if (container) {
            container.innerHTML = '<p class="error">Erreur de chargement de l\'article.</p>';
          }
          renderCategoryMenu([]);
          console.error(error);
        }
      };

      document.getElementById('year').textContent = new Date().getFullYear();
      if (categoriesToggleEl && categoriesDropdownEl) {
        categoriesToggleEl.addEventListener('click', (event) => {
          event.preventDefault();
          const expanded = categoriesToggleEl.getAttribute('aria-expanded') === 'true';
          if (expanded) {
            closeCategoriesMenu();
            return;
          }
          openCategoriesMenu();
        });

        document.addEventListener('click', (event) => {
          if (!categoriesDropdownEl.contains(event.target)) {
            closeCategoriesMenu();
          }
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeCategoriesMenu();
        });

        categoriesMenuEl.addEventListener('click', () => {
          closeCategoriesMenu();
        });
      }
      const initHome = async () => {
        usedHomepageArticleKeys.clear();
        setCanonical();
        setMetaContent('meta[property="og:url"]', `${window.location.origin}/`);
        setMetaContent('meta[property="og:image"]', `${window.location.origin}/favicon.png`);
        setMetaContent('meta[name="twitter:image"]', `${window.location.origin}/favicon.png`);
        setJsonLd(document.title, document.querySelector('meta[name="description"]')?.getAttribute('content') || '', 'Vermor Club');
        await loadLandingContent();
        await loadFeaturedArticle();
        await loadRubrics().catch(() => {
          if (rubricsSectionEl) rubricsSectionEl.hidden = true;
        });
        await loadLatestArticle();
      };

      initHome();
    </script>
  </body>
</html>
