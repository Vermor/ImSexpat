<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Vermor Club</title>
    <meta name="description" content="Vermor Club" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand" id="brand">Vermor Club</div>
      <nav class="site-nav" aria-label="Navigation principale">
        <a class="nav-link" href="/">Accueil</a>
        <a class="nav-link" href="/articles">Articles</a>
        <div class="nav-dropdown" id="categoriesDropdown">
          <button
            id="categoriesToggle"
            class="dropdown-toggle"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Categories
          </button>
          <div id="categoriesMenu" class="dropdown-menu" hidden>
            <a class="dropdown-item" href="/articles">Toutes categories</a>
          </div>
        </div>
      </nav>
      <a class="admin-link" href="/admin/login">Admin</a>
    </header>

    <main>
      <section class="hero">
        <h1 id="heroTitle">Vermor Club</h1>
        <p class="subtitle" id="heroSubtitle">Articles, chroniques et ressources en cours de construction.</p>
      </section>

      <section id="rubricsSection" class="admin-panel article-list-panel latest-article-section" hidden>
        <h2>Rubriques</h2>
        <div id="rubricsBlocks"></div>
      </section>

      <section class="admin-panel article-list-panel latest-article-section">
        <h2>Derniers articles publies</h2>
        <div id="latestArticle">
          <p class="muted">Chargement...</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© <span id="year"></span> <span id="footerText">Vermor Club</span></p>
    </footer>

    <script>
      const setText = (id, value) => {
        const el = document.getElementById(id);
        if (el && typeof value === 'string') {
          el.textContent = value;
        }
      };

      const setMetaDescription = (value) => {
        const meta = document.querySelector('meta[name="description"]');
        if (meta && value) {
          meta.setAttribute('content', value);
        }
      };

      const categoriesToggleEl = document.getElementById('categoriesToggle');
      const categoriesMenuEl = document.getElementById('categoriesMenu');
      const categoriesDropdownEl = document.getElementById('categoriesDropdown');
      const rubricsSectionEl = document.getElementById('rubricsSection');
      const rubricsBlocksEl = document.getElementById('rubricsBlocks');
      let landingRubrics = [];

      const closeCategoriesMenu = () => {
        if (!categoriesMenuEl || !categoriesToggleEl) return;
        categoriesMenuEl.hidden = true;
        categoriesToggleEl.setAttribute('aria-expanded', 'false');
      };

      const openCategoriesMenu = () => {
        if (!categoriesMenuEl || !categoriesToggleEl) return;
        categoriesMenuEl.hidden = false;
        categoriesToggleEl.setAttribute('aria-expanded', 'true');
      };

      const renderCategoryMenu = (categories) => {
        if (!categoriesMenuEl) return;
        const list = Array.isArray(categories) ? categories.filter(Boolean) : [];
        categoriesMenuEl.innerHTML = `
          <a class="dropdown-item" href="/articles">Toutes categories</a>
          ${list.map((category) => `
            <a class="dropdown-item" href="/articles?category=${encodeURIComponent(category)}">${escapeHtml(category)}</a>
          `).join('')}
        `;
      };

      const applyLandingContent = (content) => {
        if (!content || typeof content !== 'object') return;

        if (content.pageTitle) {
          document.title = content.pageTitle;
        }

        setMetaDescription(content.metaDescription);
        setText('brand', content.siteName);
        setText('heroTitle', content.heroTitle);
        setText('heroSubtitle', content.heroSubtitle);
        setText('footerText', content.footerText || content.siteName);
        landingRubrics = Array.isArray(content.rubrics) ? content.rubrics : [];
      };

      const loadLandingContent = async () => {
        try {
          const response = await fetch('/api/landing', { cache: 'no-store' });
          if (!response.ok) return;
          const content = await response.json();
          applyLandingContent(content);
        } catch (error) {
          console.error('Landing content load failed:', error);
        }
      };

      const escapeHtml = (value) => String(value || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

      const categoryStyle = (value) => {
        const text = String(value || '');
        let hash = 0;
        for (let i = 0; i < text.length; i += 1) {
          hash = ((hash << 5) - hash) + text.charCodeAt(i);
          hash |= 0;
        }
        const hue = Math.abs(hash) % 360;
        return `--chip-bg:hsl(${hue} 85% 94%);--chip-border:hsl(${hue} 50% 78%);--chip-ink:hsl(${hue} 45% 28%);`;
      };

      const renderCategoryLine = (article) => {
        const categories = Array.isArray(article.categories) ? article.categories.filter(Boolean) : [];
        if (!categories.length) return '';
        return `
          <p class="article-meta">
            <span class="meta-group">
              ${categories.map((x) => `<a class="chip chip-category chip-link" style="${categoryStyle(x)}" href="/articles?category=${encodeURIComponent(x)}">${escapeHtml(x)}</a>`).join('')}
            </span>
          </p>
        `;
      };

      const renderLatestArticles = (articles) => {
        const container = document.getElementById('latestArticle');
        if (!container) return;

        if (!Array.isArray(articles) || !articles.length) {
          container.innerHTML = '<p class="muted">Aucun article publie pour le moment.</p>';
          return;
        }

        container.innerHTML = `
          <div class="article-card-grid">
            ${articles.map((article) => `
              <article class="article-card">
                ${article.coverImageUrl ? `<a href="/article/${encodeURIComponent(article.slug)}"><img class="article-card-cover" src="${article.coverImageUrl}" alt="${escapeHtml(article.title)}" loading="lazy" /></a>` : ''}
                <div class="article-card-body">
                  ${renderCategoryLine(article)}
                  <h3><a href="/article/${encodeURIComponent(article.slug)}">${escapeHtml(article.title)}</a></h3>
                  ${article.excerpt ? `<p class="article-excerpt">${escapeHtml(article.excerpt)}</p>` : ''}
                </div>
              </article>
            `).join('')}
          </div>
        `;
      };

      const renderRubricBlock = (title, articles) => {
        const safeArticles = Array.isArray(articles) ? articles : [];
        const cols = Math.max(1, Math.min(3, safeArticles.length || 1));
        const sizeClass = safeArticles.length > 1 ? 'rubric-block-multi' : 'rubric-block-single';
        return `
          <section class="rubric-block ${sizeClass}">
            <h3>${escapeHtml(title)}</h3>
            <div class="article-card-grid rubric-card-grid" style="--rubric-cols:${cols};">
              ${safeArticles.length ? safeArticles.map((article) => `
                <article class="article-card">
                  ${article.coverImageUrl ? `<a href="/article/${encodeURIComponent(article.slug)}"><img class="article-card-cover" src="${article.coverImageUrl}" alt="${escapeHtml(article.title)}" loading="lazy" /></a>` : ''}
                  <div class="article-card-body">
                    ${renderCategoryLine(article)}
                    <h3><a href="/article/${encodeURIComponent(article.slug)}">${escapeHtml(article.title)}</a></h3>
                    ${article.excerpt ? `<p class="article-excerpt">${escapeHtml(article.excerpt)}</p>` : ''}
                  </div>
                </article>
              `).join('') : '<p class="muted">Aucun article dans cette rubrique pour le moment.</p>'}
            </div>
          </section>
        `;
      };

      const loadRubrics = async () => {
        if (!rubricsSectionEl || !rubricsBlocksEl) return;
        const safeRubrics = Array.isArray(landingRubrics) ? landingRubrics : [];
        if (!safeRubrics.length) {
          rubricsSectionEl.hidden = true;
          rubricsBlocksEl.innerHTML = '';
          return;
        }

        rubricsSectionEl.hidden = false;
        rubricsBlocksEl.innerHTML = '<p class="muted">Chargement des rubriques...</p>';

        const blocks = await Promise.all(safeRubrics.map(async (rubric) => {
          const categories = Array.isArray(rubric.categories) ? rubric.categories.filter(Boolean) : [];
          const limit = Math.max(1, Math.min(12, Number(rubric.limit) || 3));
          const title = String(rubric.title || '').trim();
          if (!title || !categories.length) return '';

          const params = new URLSearchParams({
            page: '1',
            pageSize: String(limit),
            categories: categories.join(',')
          });
          const response = await fetch(`/api/articles?${params.toString()}`, { cache: 'no-store' });
          if (!response.ok) return '';
          const payload = await response.json();
          return renderRubricBlock(title, payload.items || []);
        }));

        const html = blocks.filter(Boolean).join('');
        rubricsSectionEl.hidden = false;
        rubricsBlocksEl.innerHTML = `<div class="rubrics-layout">${html}</div>`;
      };

      const loadLatestArticle = async () => {
        try {
          const response = await fetch('/api/articles?page=1&pageSize=3', { cache: 'no-store' });
          if (!response.ok) throw new Error('Failed to load articles');
          const payload = await response.json();
          renderLatestArticles(payload.items || []);
          renderCategoryMenu((payload.taxonomies || {}).categories || []);
        } catch (error) {
          const container = document.getElementById('latestArticle');
          if (container) {
            container.innerHTML = '<p class="error">Erreur de chargement de l\'article.</p>';
          }
          renderCategoryMenu([]);
          console.error(error);
        }
      };

      document.getElementById('year').textContent = new Date().getFullYear();
      if (categoriesToggleEl && categoriesDropdownEl) {
        categoriesToggleEl.addEventListener('click', (event) => {
          event.preventDefault();
          const expanded = categoriesToggleEl.getAttribute('aria-expanded') === 'true';
          if (expanded) {
            closeCategoriesMenu();
            return;
          }
          openCategoriesMenu();
        });

        document.addEventListener('click', (event) => {
          if (!categoriesDropdownEl.contains(event.target)) {
            closeCategoriesMenu();
          }
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeCategoriesMenu();
        });

        categoriesMenuEl.addEventListener('click', () => {
          closeCategoriesMenu();
        });
      }
      loadLandingContent().then(() => loadRubrics().catch(() => {
        if (rubricsSectionEl) rubricsSectionEl.hidden = true;
      }));
      loadLatestArticle();
    </script>
  </body>
</html>
