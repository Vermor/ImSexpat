<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="6bc3b940-4007-4983-97d0-43c720a5ccc1"></script>
    <title>Sondage | Vermor Club</title>
    <meta name="description" content="Sondages actifs Vermor Club: participez et consultez les resultats des opinions sur les articles." />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <link rel="canonical" href="/sondage" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vermor Club" />
    <meta property="og:title" content="Sondage | Vermor Club" />
    <meta property="og:description" content="Sondages actifs Vermor Club: participez et consultez les resultats des opinions sur les articles." />
    <meta property="og:url" content="/sondage" />
    <meta property="og:image" content="/favicon.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sondage | Vermor Club" />
    <meta name="twitter:description" content="Sondages actifs Vermor Club: participez et consultez les resultats des opinions sur les articles." />
    <meta name="twitter:image" content="/favicon.png" />
    <link rel="stylesheet" href="/theme/line-awesome.min.css" />
    <script type="application/ld+json" id="pollJsonLd">
      {
        "@context": "https://schema.org",
        "@type": "CollectionPage",
        "name": "Sondages actifs Vermor Club",
        "url": "/sondage",
        "inLanguage": "fr"
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="page-polls">
    <header class="site-header">
      <div class="header-social" aria-label="Raccourcis sociaux">
        <a href="/" aria-label="Facebook"><i class="lab la-facebook-f"></i></a>
        <a href="/articles" aria-label="Magazine"><i class="las la-newspaper"></i></a>
        <a href="/sondage" aria-label="Debats"><i class="las la-comments"></i></a>
      </div>
      <a class="brand" href="/">VERMOR CLUB</a>
      <nav class="site-nav" aria-label="Navigation principale">
        <a class="nav-link" href="/">Accueil</a>
        <a class="nav-link" href="/articles">Articles</a>
        <a class="nav-link" href="/sondage">Sondage</a>
        <div class="nav-dropdown" id="categoriesDropdown">
          <button
            id="categoriesToggle"
            class="nav-link dropdown-toggle"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
          >
            Categories
          </button>
          <div id="categoriesMenu" class="dropdown-menu" hidden>
            <a class="dropdown-item" href="/articles">Toutes categories</a>
          </div>
        </div>
      </nav>
      <a class="admin-link" href="/admin">Admin</a>
    </header>

    <main class="container">
      <section class="page-hero">
        <p class="kicker">Opinions</p>
        <h1>Sondages actifs</h1>
        <p class="subtitle">Suivez les votes ouverts sur les articles et consultez les tendances en cours.</p>
      </section>

      <section class="card">
        <h1 class="poll-page-title">Sondages actifs</h1>
        <p class="muted">Questions d'opinion ouvertes sur les articles.</p>
      </section>

      <section class="card">
        <div id="pollList" class="admin-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-social" aria-label="Navigation rapide">
        <a href="/" aria-label="Accueil"><i class="las la-home"></i></a>
        <a href="/articles" aria-label="Articles"><i class="las la-book-open"></i></a>
        <a href="/sondage" aria-label="Sondage"><i class="las la-poll"></i></a>
      </div>
      <p>Debats Vermor Club</p>
    </footer>

    <script>
      const pollListEl = document.getElementById('pollList');
      const categoriesDropdownEl = document.getElementById('categoriesDropdown');
      const categoriesToggleEl = document.getElementById('categoriesToggle');
      const categoriesMenuEl = document.getElementById('categoriesMenu');

      const closeCategoriesMenu = () => {
        if (!categoriesToggleEl || !categoriesMenuEl) return;
        categoriesToggleEl.setAttribute('aria-expanded', 'false');
        categoriesMenuEl.hidden = true;
      };

      const openCategoriesMenu = () => {
        if (!categoriesToggleEl || !categoriesMenuEl) return;
        categoriesToggleEl.setAttribute('aria-expanded', 'true');
        categoriesMenuEl.hidden = false;
      };

      const escapeHtml = (value) => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');

      const setSeoForPollPage = () => {
        const canonical = document.querySelector('link[rel="canonical"]');
        if (canonical) canonical.setAttribute('href', `${window.location.origin}/sondage`);
        const ogUrl = document.querySelector('meta[property="og:url"]');
        if (ogUrl) ogUrl.setAttribute('content', `${window.location.origin}/sondage`);
        const ogImage = document.querySelector('meta[property="og:image"]');
        if (ogImage) ogImage.setAttribute('content', `${window.location.origin}/favicon.png`);
        const twImage = document.querySelector('meta[name="twitter:image"]');
        if (twImage) twImage.setAttribute('content', `${window.location.origin}/favicon.png`);

        const jsonLd = document.getElementById('pollJsonLd');
        if (jsonLd) {
          jsonLd.textContent = JSON.stringify({
            '@context': 'https://schema.org',
            '@type': 'CollectionPage',
            name: 'Sondages actifs Vermor Club',
            url: `${window.location.origin}/sondage`,
            inLanguage: 'fr'
          });
        }
      };

      const renderCategoryMenu = (categories) => {
        if (!categoriesMenuEl) return;
        const safe = Array.isArray(categories) ? categories.filter(Boolean) : [];
        const links = ['<a class="dropdown-item" href="/articles">Toutes categories</a>']
          .concat(safe.map((category) => `<a class="dropdown-item" href="/articles?category=${encodeURIComponent(category)}">${escapeHtml(category)}</a>`));
        categoriesMenuEl.innerHTML = links.join('');
      };

      const fetchOpinionArticles = async () => {
        const pageSize = 50;
        const items = [];
        for (let page = 1; page <= 20; page += 1) {
          const response = await fetch(`/api/articles?page=${page}&pageSize=${pageSize}`, { cache: 'no-store' });
          if (!response.ok) throw new Error('Impossible de charger les articles');
          const payload = await response.json();
          const pageItems = Array.isArray(payload.items) ? payload.items : [];
          items.push(...pageItems);
          const totalPages = Number(payload.pagination && payload.pagination.totalPages || 1);
          if (page >= totalPages) {
            return {
              items,
              categories: payload.taxonomies && Array.isArray(payload.taxonomies.categories) ? payload.taxonomies.categories : []
            };
          }
        }
        return { items, categories: [] };
      };

      const renderPollCards = (rows) => {
        if (!pollListEl) return;
        if (!rows.length) {
          pollListEl.innerHTML = '<p class="muted">Aucun sondage actif pour le moment.</p>';
          return;
        }

        const truncateText = (value, maxLength = 92) => {
          const text = String(value ?? '').trim();
          if (!text) return '';
          if (text.length <= maxLength) return text;
          return `${text.slice(0, maxLength - 3).trimEnd()}...`;
        };

        pollListEl.innerHTML = `
          <div class="poll-card-list">
            ${rows.map((row) => {
              const options = Array.isArray(row.snapshot.options) ? row.snapshot.options : [];
              const total = Number(row.snapshot.totalVotes || 0);
              const optionsHtml = options.map((opt) => {
                const votes = Number(opt.votes || 0);
                const pct = total > 0 ? Math.round((votes / total) * 100) : 0;
                return `
                  <div class="poll-result-item">
                    <div class="poll-result-head">
                      <strong>${escapeHtml(opt.label)}</strong>
                      <span class="muted">${votes} vote(s) - ${pct}%</span>
                    </div>
                    <div class="opinion-bar"><span style="width:${pct}%;"></span></div>
                  </div>
                `;
              }).join('');

              return `
                <article class="article-card">
                  <div class="article-card-body">
                    <h2 class="poll-question-title">${escapeHtml(row.snapshot.question || row.article.opinionQuestion || 'Sondage')}</h2>
                    <p class="muted">Resultat actuel: ${total} vote(s)</p>
                    <div class="poll-results">${optionsHtml || '<p class="muted">Aucun choix pour ce sondage.</p>'}</div>
                    <a class="poll-article-link poll-article-link-bottom" href="/article/${encodeURIComponent(row.article.slug)}">
                      ${row.article.coverImageUrl ? `<img class="article-card-cover poll-cover-thumb" src="${row.article.coverImageUrl}" alt="${escapeHtml(row.article.title)}" loading="lazy" />` : ''}
                      <span class="poll-article-title">${escapeHtml(truncateText(row.article.title || 'Voir l article'))}</span>
                    </a>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        `;
      };

      const loadPage = async () => {
        try {
          const data = await fetchOpinionArticles();
          renderCategoryMenu(data.categories);
          const opinionArticles = (Array.isArray(data.items) ? data.items : [])
            .filter((a) => Boolean(a && a.opinionEnabled && a.slug));

          if (!opinionArticles.length) {
            renderPollCards([]);
            return;
          }

          const rows = await Promise.all(opinionArticles.map(async (article) => {
            const response = await fetch(`/api/articles/${encodeURIComponent(article.slug)}/opinion`, { cache: 'no-store' });
            if (!response.ok) return null;
            const snapshot = await response.json();
            if (!snapshot || !snapshot.enabled) return null;
            return { article, snapshot };
          }));

          renderPollCards(rows.filter(Boolean));
        } catch (error) {
          if (pollListEl) pollListEl.innerHTML = `<p class="error">${escapeHtml(error.message || 'Erreur de chargement')}</p>`;
        }
      };

      if (categoriesToggleEl && categoriesDropdownEl) {
        categoriesToggleEl.addEventListener('click', (event) => {
          event.preventDefault();
          const expanded = categoriesToggleEl.getAttribute('aria-expanded') === 'true';
          if (expanded) {
            closeCategoriesMenu();
            return;
          }
          openCategoriesMenu();
        });

        document.addEventListener('click', (event) => {
          if (!categoriesDropdownEl.contains(event.target)) closeCategoriesMenu();
        });

        document.addEventListener('keydown', (event) => {
          if (event.key === 'Escape') closeCategoriesMenu();
        });

        categoriesMenuEl.addEventListener('click', () => {
          closeCategoriesMenu();
        });
      }

      setSeoForPollPage();
      loadPage().catch(() => {});
    </script>
  </body>
</html>
